services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zagros
      POSTGRES_PASSWORD: zagros
      POSTGRES_DB: zagros
    ports:
      - "5432:5432"
    volumes:
      - zagros_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zagros"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://zagros:zagros@db:5432/zagros
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE:-09120000000}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-ChangeMe123}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-مدیر سیستم}
      UPLOAD_DIR: /app/uploads
    volumes:
      - zagros_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  zagros_pg:
  zagros_uploads:
